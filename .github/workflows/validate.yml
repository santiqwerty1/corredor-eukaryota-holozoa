name: Validar corpus

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar archivos generados
        run: python scripts/render.py --check

      - name: Auditar migración
        run: python scripts/audit_migration.py

      - name: Validar corpus
        run: python scripts/validate.py
